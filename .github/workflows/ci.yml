name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: API tests (temp SQLite, not the dev database)
        run: pytest tests/ -v 2>&1 | tee pytest.out; exit ${PIPESTATUS[0]}
      - name: Show pytest output
        if: failure()
        run: echo "::notice title=pytest::$(head -c 1500 pytest.out | tr '\n' '|')"

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Static analysis
        run: flutter analyze 2>&1 | tee analyze.out; exit ${PIPESTATUS[0]}
      - name: Show analyzer output
        if: failure()
        run: echo "::notice title=analyze::$(head -c 3000 analyze.out | tr '\n' '|')"
      - name: Unit and widget tests
        run: flutter test
      - name: Report which tests ran
        if: always()
        run: echo "::notice title=flutter::flutter test finished (see job result)"
