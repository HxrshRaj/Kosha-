services:
  - type: web
    name: kosha-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kosha-db
          property: connectionString

databases:
  - name: kosha-db
    plan: free
    databaseName: kosha
    user: kosha
